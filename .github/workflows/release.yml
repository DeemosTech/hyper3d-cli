name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
# Serialize publications across both channels. Never cancel an in-flight publish.
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Select and validate release version
        id: release
        run: node scripts/release-version.mjs
      - name: Prevent duplicate or outdated publications
        env:
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        run: node scripts/verify-registry-version.mjs
      - run: npm run test:install
      - name: Pack release artifact
        run: |
          mkdir release
          npm pack --workspace @hyper3d/cli --pack-destination release
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: release/*.tgz
      - name: Publish with npm trusted publishing
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: npm publish release/*.tgz --access public --provenance --tag "$CHANNEL"
      - name: Create stable GitHub release
        if: steps.release.outputs.channel == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/*.tgz --verify-tag --generate-notes
